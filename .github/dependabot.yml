# Dependency updates, one grouped pull request per ecosystem per week. CI checks them like any other PR.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # png 0.18 changed the decoder's API (its reader must seek); taken by hand when the readers are adapted
      - dependency-name: "png"
        update-types: ["version-update:semver-minor"]
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(app)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(ci)"
