# Dependency updates, one grouped pull request per ecosystem per week. CI checks them like any other PR.
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      cargo:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(cargo)"

  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(app)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "deps(ci)"
