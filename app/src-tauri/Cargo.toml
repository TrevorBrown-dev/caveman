[package]
name = "caveman-app"
description = "Caveman: design, preview and build ReSkate decks"
version = "0.1.0"
edition = "2021"

[lib]
name = "caveman_app"
path = "src/lib.rs"

[[bin]]
name = "caveman-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
caveman-core = { path = "../../crates/caveman-core" }
caveman-cli = { path = "../../crates/caveman-cli" }
