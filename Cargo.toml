[workspace]
resolver = "2"
members = ["crates/caveman-core", "crates/caveman-cli", "crates/caveman-fx", "crates/caveman-trainer", "launcher", "app/src-tauri"]
# app/src-tauri is the Tauri app (app/README.md): it needs the MinGW tools on PATH, so a plain `cargo build` here leaves it out
default-members = ["crates/caveman-core", "crates/caveman-cli", "crates/caveman-fx", "crates/caveman-trainer", "launcher"]
# launcher/ builds caveman-launcher.exe, installed as Caveman.exe beside ReSkateLauncher.exe (it runs the build in process)

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "GPL-3.0-only"
repository = "https://github.com/TrevorBrown-dev/caveman"
homepage = "https://trevorbrown.dev/gh/caveman"

# CI runs `cargo clippy --workspace --all-targets -- -D warnings`. These four lints are off on purpose: the texture and
# mesh code indexes several slices in lockstep (needless_range_loop), passes the game's many plain parameters as they
# come (too_many_arguments), and keeps readers' return shapes and build enums as they are (type_complexity,
# large_enum_variant). Everything else clippy says is fixed, not silenced.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
large_enum_variant = "allow"
# `chunks_exact(N)` over texel and record bytes reads as the format descriptions do; `as_chunks` can replace it in a
# pass of its own.
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = 3
